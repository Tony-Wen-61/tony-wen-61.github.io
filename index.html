<script>
    (function() {
        document.addEventListener("DOMContentLoaded", function () {
            const element = document.getElementById("typewriter-text");
            if (!element) return;
            
            let texts = [];
            try {
                texts = JSON.parse(element.getAttribute("data-texts"));
            } catch (e) {
                console.error("Failed to parse typewriter texts:", e);
            }
            
            if (!texts || texts.length === 0) return;
            
            
            if (texts.length > 0) {
                const selectedText = texts[Math.floor(Math.random() * texts.length)];
                texts = [selectedText];
            }
            
            
            element.innerHTML = "";
            
            
            const textSpan = document.createElement("span");
            textSpan.className = "typewriter-content";
            element.appendChild(textSpan);
            
            
            const cursorSpan = document.createElement("span");
            cursorSpan.className = "typewriter-cursor";
            cursorSpan.textContent = "|";
            element.appendChild(cursorSpan);
            
            let textIndex = 0;
            let charIndex = 0;
            let isDeleting = false;
            let typingSpeed = 100; 
            let deletingSpeed = 50; 
            let delayBetweenTexts = 2500; 
            
            function type() {
                if (textIndex >= texts.length) {
                    textIndex = 0;
                }
                const currentFullText = texts[textIndex];
                
                if (isDeleting) {
                    
                    textSpan.textContent = currentFullText.substring(0, charIndex - 1);
                    charIndex--;
                    
                    if (charIndex === 0) {
                        isDeleting = false;
                        textIndex = (textIndex + 1) % texts.length;
                        setTimeout(type, 500); 
                        return;
                    }
                    setTimeout(type, deletingSpeed);
                } else {
                    
                    textSpan.textContent = currentFullText.substring(0, charIndex + 1);
                    charIndex++;
                    
                    if (charIndex === currentFullText.length) {
                        if (texts.length === 1) {
                            
                            cursorSpan.style.display = "none";
                            return;
                        }
                        isDeleting = true;
                        setTimeout(type, delayBetweenTexts); 
                        return;
                    }
                    setTimeout(type, typingSpeed);
                }
            }
            
            
            setTimeout(type, 800);
        });
    })();
</script>
